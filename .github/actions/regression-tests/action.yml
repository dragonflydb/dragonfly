name: Regression Tests
description: "Run regression tests"

inputs:
  dfly-executable:
    required: true
    type: string
  gspace-secret:
    required: false
    type: string
  run-only-on-ubuntu-latest:
    # 'true' or 'false' cause boolean
    # is not supported in composite actions
    required: true
    type: string
  build-folder-name:
    required: true
    type: string
  filter:
    required: false
    type: string
  aws-access-key-id:
    required: false
    type: string
    description: "AWS access key ID (optional if using OIDC - credentials set by workflow)"
  aws-secret-access-key:
    required: false
    type: string
    description: "AWS secret access key (optional if using OIDC - credentials set by workflow)"
  aws-role-to-assume:
    required: false
    type: string
    description: "AWS role ARN to assume before uploading JUnit XML to S3"
  aws-region:
    required: false
    type: string
    default: us-east-1
    description: "AWS region for S3 JUnit XML uploads"
  s3-bucket:
    required: false
    type: string
    description: "S3 bucket for Dragonfly snapshot tests; when empty, the S3 snapshot tests are skipped"
  junit-s3-bucket:
    required: false
    type: string
    description: "S3 bucket for JUnit XML uploads"
  azure-container:
    required: false
    type: string
    description: "Azure Blob Storage container name for snapshot tests"
  azure-storage-connection-string:
    required: false
    type: string
    description: "Azure Storage connection string"
  epoll:
    required: false
    type: string
  df-runtime-flags:
    required: false
    type: string
    description: "Runtime flags to pass to the dragonfly process via --df, e.g. 'enable_resp_io_loop_v2=true'"
  # Pytest - manual trigger inputs
  test-suites:
    required: false
    default: ""
    type: string
    description: "Optional pytest filenames relative to tests/dragonfly; empty runs all suites once"
  test-cases:
    required: false
    default: ""
    type: string
    description: "Optional extended regular expression matched against collected pytest node IDs; empty runs all cases"
  iterations:
    required: false
    default: "1"
    type: string
    description: "Optional number of times to run selected pytest tests; defaults to 1"
  # GoogleTest - manual trigger inputs
  gtest-suites:
    required: false
    default: ""
    type: string
    description: "Optional GoogleTest target names for manually dispatched workflows; empty runs all suites once"
  gtest-cases:
    required: false
    default: ""
    type: string
    description: "Optional value forwarded to --gtest_filter"
  gtest-iterations:
    required: false
    default: "0"
    type: string
    description: "Number of times to run selected GoogleTest suites; default: 0 (skips GoogleTests)"
  run-gtests:
    required: false
    default: "false"
    type: string
    description: "Enable GoogleTest execution for workflows that expose GoogleTest controls"
  max-tests-run-time:
    required: false
    default: ""
    type: string
    description: "Optional shared Pytest and GoogleTest budget in minutes for manual workflows"
  continue-on-test-failure:
    required: false
    default: "false"
    type: string
    description: "When true, both test families continue selected iterations after failures and fail after all runs complete"

runs:
  using: "composite"
  # bring back timeouts once composite actions start supporting them
  # timeout-minutes: 20
  steps:
    - name: Sync valkey-search tests
      uses: ./.github/actions/sync-valkey-tests

    - name: Free disk space
      if: contains(runner.labels, 'self-hosted') == false
      shell: bash
      run: |
        echo "===================Before freeing up space ============================================"
        df -h
        rm -rf /hostroot/usr/share/dotnet
        rm -rf /hostroot/usr/local/share/boost
        rm -rf /hostroot/usr/local/lib/android
        rm -rf /hostroot/opt/ghc
        echo "===================After freeing up space ============================================"
        df -h

    - name: Install Python test requirements
      shell: bash
      run: ${GITHUB_WORKSPACE}/.github/scripts/install-pytest-requirements.sh

    - name: Prepare regression JUnit environment
      if: always()
      shell: bash
      env:
        DF_RUNTIME_FLAGS_INPUT: ${{ inputs.df-runtime-flags }}
      run: |
        JUNIT_DIR="${GITHUB_WORKSPACE}/test-results/junit/regression"
        mkdir -p "${JUNIT_DIR}"

        KIND="iouring"
        if [[ "${{inputs.epoll}}" == 'epoll' ]]; then
          KIND="epoll"
        fi

        FILTER="${{inputs.filter}}"
        if [[ -z "${FILTER}" ]]; then
          FILTER="all"
        fi

        SAFE_FILTER=$("${GITHUB_WORKSPACE}/.github/scripts/sanitize-token.sh" "${FILTER}" all)
        SAFE_RUNTIME_FLAGS=$("${GITHUB_WORKSPACE}/.github/scripts/sanitize-token.sh" "${DF_RUNTIME_FLAGS_INPUT}" default)

        UNIQUE_SUFFIX="$(date +%s%N)-${RANDOM}"
        {
          echo "REGRESSION_JUNIT_DIR=${JUNIT_DIR}"
          echo "REGRESSION_JUNIT_KIND=${KIND}"
          echo "REGRESSION_JUNIT_S3_SUFFIX=${RUNNER_OS}-${RUNNER_ARCH}-${KIND}-${SAFE_FILTER}-${SAFE_RUNTIME_FLAGS}"
          echo "REGRESSION_JUNIT_ARTIFACT=junit-regression-${GITHUB_JOB}-${RUNNER_OS}-${RUNNER_ARCH}-${KIND}-${SAFE_FILTER}-${SAFE_RUNTIME_FLAGS}-${UNIQUE_SUFFIX}"
        } >> "${GITHUB_ENV}"

    - name: Run S3 snapshot tests with MinIO
      if: inputs.s3-bucket != '' && inputs.test-suites == '' && inputs.test-cases == '' && inputs.iterations == '1'
      shell: bash
      env:
        DF_RUNTIME_FLAGS_INPUT: ${{ inputs.df-runtime-flags }}
      run: |
        echo "=== Running S3 snapshot tests with local MinIO ==="
        cd ${GITHUB_WORKSPACE}/tests

        export DRAGONFLY_PATH="${GITHUB_WORKSPACE}/${{inputs.build-folder-name}}/${{inputs.dfly-executable}}"

        # Match the Dragonfly I/O loop configuration selected by the surrounding workflow matrix.
        df_runtime_args=()
        if [[ -n "${DF_RUNTIME_FLAGS_INPUT}" ]]; then
          set -f
          for flag in ${DF_RUNTIME_FLAGS_INPUT}; do
            df_runtime_args+=(--df "$flag")
          done
          set +f
        fi
        if [[ "${{ inputs.epoll }}" == 'epoll' ]]; then
          df_runtime_args+=(--df force_epoll=true)
        fi

        # MinIO binary is downloaded and started by conftest.py when MINIO_S3_ENDPOINT is set
        MINIO_S3_ENDPOINT=http://localhost:9000 timeout 10m pytest -k "s3" --timeout=300 --color=yes dragonfly/snapshot_test.py "${df_runtime_args[@]}" --log-cli-level=INFO -v

    - name: Setup core dump capture
      if: success()
      shell: bash
      # core_pattern is a global kernel setting, so writing it once here persists for
      # every later step. ulimit is NOT global -- it's per-process, so it must be raised
      # again at the start of each step that can spawn a crashing process (see below).
      run: |
        mkdir -p /tmp/core_dumps /tmp/df_ci_collected_cores
        echo '/tmp/core_dumps/core.%e.%p.%t' >/proc/sys/kernel/core_pattern 2>/dev/null \
          || echo "Warning: could not write core_pattern; relying on systemd-coredump instead"

    - name: Verify core dump capture
      if: success()
      shell: bash
      # Crashes a canary process so a broken pipeline is caught here, not on a real crash later.
      run: |
        set -eo pipefail
        ulimit -Hc unlimited 2>/dev/null || true
        ulimit -Sc unlimited || echo "Warning: 'ulimit -c unlimited' failed (hard: $(ulimit -Hc))"
        staging=/tmp/df_ci_collected_cores
        relocate() {
          local f
          while IFS= read -r -d '' f; do
            mv "$f" "${staging}/$(date +%s%N)-$(basename "$f")" 2>/dev/null || true
          done < <(find /tmp/core_dumps /tmp/tmp* -maxdepth 1 -type f \
            \( -name 'core' -o -name 'core.*' -o -name 'core-*' \) -print0 2>/dev/null)
          while IFS= read -r -d '' f; do
              if [[ "$f" == *.zst ]] && command -v zstd >/dev/null 2>&1; then
                zstd -dq "$f" -o "${staging}/$(date +%s%N)-$(basename "${f%.zst}")" 2>/dev/null && rm -f "$f" \
                  || mv "$f" "${staging}/$(date +%s%N)-$(basename "$f")" 2>/dev/null || true
              else
                mv "$f" "${staging}/$(date +%s%N)-$(basename "$f")" 2>/dev/null || true
              fi
          done < <(find /hostroot/var/lib/systemd/coredump -maxdepth 1 -type f -name 'core.*' -print0 2>/dev/null)
          return 0
        }
        echo "=== Verifying core dump capture works in this environment ==="
        canary_cwd="$(mktemp -d)"
        # Match by PID, not just "*-core*": an earlier step's crash (e.g. a flaky unit
        # test) can leave an unrelated core sitting in the same search locations, which
        # a name-only match would mistake for this canary and report a false pass.
        (cd "${canary_cwd}" && exec sh -c 'kill -SEGV $$') &
        canary_pid=$!
        wait "${canary_pid}" 2>/dev/null || true
        canary=""
        for _ in $(seq 1 30); do
          relocate
          canary=$(find "${staging}" -maxdepth 1 -name "*.${canary_pid}.*" 2>/dev/null | head -1 || true)
          [[ -n "${canary}" ]] && break
          sleep 0.2
        done
        rm -rf "${canary_cwd}"
        if [[ -n "${canary}" ]]; then
          echo "Core dump capture verified OK (canary pid=${canary_pid}: ${canary})"
          rm -f "${canary}"
        else
          echo "WARNING: core dump capture canary FAILED; a real crash won't leave a usable core"
        fi

    - name: Run PyTests
      id: main
      if: success()
      shell: bash
      # Start the manual test budget with Pytest; GoogleTest uses the same deadline.
      run: |
        ulimit -Hc unlimited 2>/dev/null || true
        ulimit -Sc unlimited || echo "Warning: 'ulimit -c unlimited' failed (hard: $(ulimit -Hc))"
        if [[ -n "${MAX_TESTS_RUN_TIME_MINUTES}" ]]; then
          echo "Shared regression test time budget: ${MAX_TESTS_RUN_TIME_MINUTES} minutes (Pytest and GoogleTest)"
          export REGRESSION_DEADLINE_EPOCH=$(( $(date +%s) + 10#${MAX_TESTS_RUN_TIME_MINUTES} * 60 ))
          echo "REGRESSION_DEADLINE_EPOCH=${REGRESSION_DEADLINE_EPOCH}" >> "$GITHUB_ENV"
        fi
        "${GITHUB_WORKSPACE}/.github/scripts/run-regression-tests-helper.sh" pytest
      env:
        BUILD_FOLDER_NAME: ${{ inputs.build-folder-name }}
        REGRESSION_DFLY_EXECUTABLE: ${{ inputs.dfly-executable }}
        TEST_FILTER: ${{ inputs.filter }}
        # Pass the raw runtime-flags input through the environment so the value is never
        # embedded directly in the shell script (avoids shell injection).
        DF_RUNTIME_FLAGS_INPUT: ${{ inputs.df-runtime-flags }}
        TEST_SUITES_INPUT: ${{ inputs.test-suites }}
        TEST_CASES_INPUT: ${{ inputs.test-cases }}
        ITERATIONS_INPUT: ${{ inputs.iterations }}
        MAX_TESTS_RUN_TIME_MINUTES: ${{ inputs.max-tests-run-time }}
        CONTINUE_ON_TEST_FAILURE_INPUT: ${{ inputs.continue-on-test-failure }}
        DELETE_FAILED_LOGS: ${{ github.event_name == 'workflow_dispatch' && 'false' || 'true' }}
        # Add environment variables to enable the S3 snapshot test.
        # AWS credentials: if inputs provided, use them; otherwise rely on workflow OIDC auth
        DRAGONFLY_S3_BUCKET: ${{ inputs.s3-bucket }}
        AWS_ACCESS_KEY_ID: ${{ inputs.aws-access-key-id || env.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.aws-secret-access-key || env.AWS_SECRET_ACCESS_KEY }}
        AWS_SESSION_TOKEN: ${{ env.AWS_SESSION_TOKEN }}
        AWS_REGION: ${{ env.AWS_REGION || 'us-east-1' }}
        # Azure credentials for snapshot tests (optional)
        DRAGONFLY_AZURE_CONTAINER: ${{ inputs.azure-container }}
        AZURE_STORAGE_CONNECTION_STRING: ${{ inputs.azure-storage-connection-string }}

    - name: Collect core dumps on failure
      if: failure()
      shell: bash
      run: |
        set -eo pipefail
        staging=/tmp/df_ci_collected_cores
        dest=/tmp/failed/cores
        while IFS= read -r -d '' f; do
          mv "$f" "${staging}/$(date +%s%N)-$(basename "$f")" 2>/dev/null || true
        done < <(find /tmp/core_dumps /tmp/tmp* -maxdepth 1 -type f \
          \( -name 'core' -o -name 'core.*' -o -name 'core-*' \) -print0 2>/dev/null)
        while IFS= read -r -d '' f; do
          if [[ "$f" == *.zst ]] && command -v zstd >/dev/null 2>&1; then
            zstd -dq "$f" -o "${staging}/$(date +%s%N)-$(basename "${f%.zst}")" 2>/dev/null && rm -f "$f" \
              || mv "$f" "${staging}/$(date +%s%N)-$(basename "$f")" 2>/dev/null || true
          else
            mv "$f" "${staging}/$(date +%s%N)-$(basename "$f")" 2>/dev/null || true
          fi
        done < <(find /hostroot/var/lib/systemd/coredump -maxdepth 1 -type f -name 'core.*' -print0 2>/dev/null)
        shopt -s nullglob
        found=false
        for f in "${staging}"/*; do
          mkdir -p "${dest}"
          mv "$f" "${dest}/"
          found=true
        done
        shopt -u nullglob
        if [[ "${found}" == true ]]; then
          echo "Collected core dump(s) into ${dest}"
          cp "${GITHUB_WORKSPACE}/${{ inputs.build-folder-name }}/${{ inputs.dfly-executable }}" "${dest}/" 2>/dev/null || true
        else
          echo "No core dumps found to collect"
        fi

    - name: Build and run GoogleTests
      if: always() && github.event_name == 'workflow_dispatch' && inputs.run-gtests == 'true'
      shell: bash
      run: |
        ulimit -Hc unlimited 2>/dev/null || true
        ulimit -Sc unlimited || echo "Warning: 'ulimit -c unlimited' failed (hard: $(ulimit -Hc))"
        "${GITHUB_WORKSPACE}/.github/scripts/run-regression-tests-helper.sh" gtest
      env:
        BUILD_FOLDER_NAME: ${{ inputs.build-folder-name }}
        GTEST_SUITES_INPUT: ${{ inputs.gtest-suites }}
        GTEST_CASES_INPUT: ${{ inputs.gtest-cases }}
        GTEST_ITERATIONS_INPUT: ${{ inputs.gtest-iterations }}
        MAX_TESTS_RUN_TIME_MINUTES: ${{ inputs.max-tests-run-time }}
        CONTINUE_ON_TEST_FAILURE_INPUT: ${{ inputs.continue-on-test-failure }}

    - name: Upload regression JUnit results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.REGRESSION_JUNIT_ARTIFACT }}
        path: ${{ github.workspace }}/test-results/junit/regression/**/*.xml
        if-no-files-found: ignore

    - name: Refresh AWS credentials for regression JUnit upload
      if: always() && inputs.junit-s3-bucket != '' && inputs.aws-role-to-assume != ''
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.aws-role-to-assume }}
        aws-region: ${{ inputs.aws-region }}
        unset-current-credentials: true

    - name: Upload regression JUnit results to S3
      if: always() && inputs.junit-s3-bucket != '' && inputs.aws-role-to-assume != ''
      shell: bash
      run: |
        "${GITHUB_WORKSPACE}/.github/scripts/upload-test-results-to-s3.sh" \
          dir junit "${REGRESSION_JUNIT_DIR}" "${{ inputs.junit-s3-bucket }}" "regression" \
          "${REGRESSION_JUNIT_S3_SUFFIX}" "regression JUnit" "*.xml"

    - name: Send notification on failure
      if: failure() && github.ref == 'refs/heads/main'
      shell: bash
      run: |
        get_failed_tests() {
          local report_file=$1
          echo $(jq -r '.tests[] | select(.outcome == "failed") | .nodeid' "$report_file")
        }
        cd ${GITHUB_WORKSPACE}/tests
        failed_tests=""
        if [ -f report.json ]; then
          failed_tests=$(get_failed_tests report.json)
        fi

        KIND="iouring"
        if [[ "${{inputs.epoll}}" == 'epoll' ]]; then
          KIND="epoll"
        fi

        job_link="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        message="Regression $KIND tests failed.\\n The commit is: ${{github.sha}}.\\n $failed_tests \\n Job Link: ${job_link}\\n"

        curl -s \
          -X POST \
          -H 'Content-Type: application/json' \
          '${{ inputs.gspace-secret }}' \
          -d '{"text": "'"${message}"'"}'
    - name: Copy binary on a self hosted runner
      if: failure() && contains(runner.labels, 'self-hosted')
      shell: bash
      run: |
        cd ${GITHUB_WORKSPACE}/build
        timestamp=$(date +%Y-%m-%d_%H:%M:%S)
        mv ./dragonfly /var/crash/dragonfly_${timestamp}
