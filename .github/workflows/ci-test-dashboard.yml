name: CI Test Dashboard

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Number of recent UTC days to include"
        required: false
        type: number
        default: 30
      publish_bucket:
        description: "Optional S3 bucket to publish the static dashboard to"
        required: false
        type: string
      publish_prefix:
        description: "Optional prefix within the publish bucket"
        required: false
        type: string
  pull_request:
    branches: [main]
    # Run the test job only when dashboard code or this workflow changes.
    paths:
      - "tools/ci_test_dashboard/**"
      - ".github/workflows/ci-test-dashboard.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Runs if a PR triggers
  test-links:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test CI dashboard GitHub links
        run: python3 -m unittest tools/ci_test_dashboard/test_sync_issue_links.py

  # Runs if a schedule or workflow_dispatch triggers
  publish:
    if: github.event_name != 'pull_request' && github.repository == 'dragonflydb/dragonfly'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ci-test-dashboard-publish-${{ github.repository }}
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write
      issues: read        # read public issues
      pull-requests: read # read PRs

    env:
      DASHBOARD_ROOT: tools/ci_test_dashboard
      LOOKBACK_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.lookback_days || '30' }}
      SOURCE_BUCKET: ${{ secrets.S3_REGTEST_BUCKET }}
      PUBLISH_BUCKET: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_bucket || secrets.S3_CI_TEST_DASHBOARD_BUCKET }}
      PUBLISH_PREFIX: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_prefix || vars.CI_TEST_DASHBOARD_PREFIX }}

    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_CI_S3_ROLE_ARN }}
          aws-region: us-east-1

      - name: Ensure AWS CLI is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v aws >/dev/null 2>&1; then
            python3 -m pip install --user awscli
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/bin:$PATH"
          fi
          aws --version

      - name: Refresh daily summaries and build dashboard data
        shell: bash
        run: |
          set -euo pipefail
          python3 "${DASHBOARD_ROOT}/sync_dashboard.py" \
            --source-bucket "${SOURCE_BUCKET}" \
            --lookback-days "${LOOKBACK_DAYS}" \
            --work-dir "${RUNNER_TEMP}/ci-test-dashboard" \
            "${DASHBOARD_ROOT}/site/data"

      # Create data/issue-links.json - containing related issue/PR/assignee lookup data.
      # The artifact upload/S3 publish include that additional static file.
      - name: Link tests to GitHub issues and pull requests
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 "${DASHBOARD_ROOT}/sync_issue_links.py" "${DASHBOARD_ROOT}/site/data"

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v7
        with:
          name: ci-test-dashboard
          path: ${{ env.DASHBOARD_ROOT }}/site
          if-no-files-found: error

      - name: Publish dashboard site to S3
        if: env.PUBLISH_BUCKET != ''
        shell: bash
        run: python3 "${GITHUB_WORKSPACE}/.github/scripts/publish-ci-dashboard-site-to-s3.py"

      - name: Skip S3 publish
        if: env.PUBLISH_BUCKET == ''
        run: echo "No publish bucket configured; dashboard is available as a workflow artifact."
