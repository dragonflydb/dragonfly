name: Epoll Regression Tests

on:
  schedule:
    - cron: "0 0/3 * * *"
  workflow_dispatch:
    inputs:
      # Manual trigger inputs: select and repeat regression test runs.
      test-suites:
        description: "Optional pytest filenames; see .github/REGRESSION-TESTS.md. Example: connection_test,eval_test"
        required: false
        default: ""
        type: string
      test-cases:
        description: "Optional regex for pytest node IDs; see .github/REGRESSION-TESTS.md. Example: test_golang_asynq_script|test_shared_read_buffer_overflow_copy_metric"
        required: false
        default: ""
        type: string
      iterations:
        description: "Optional pytest run count; see .github/REGRESSION-TESTS.md. Default: 1. Example: 12"
        required: false
        default: "1"
        type: string
      max-run-time:
        description: "Optional test budget in minutes; see .github/REGRESSION-TESTS.md. Default: 360 (6 hours)"
        required: false
        default: ""
        type: string
      gtest-suites:
        description: "Optional GoogleTest targets; see .github/REGRESSION-TESTS.md. Example: dfly_core_test,redis_parser_test"
        required: false
        default: ""
        type: string
      gtest-cases:
        description: "Optional GoogleTest --gtest_filter value; see .github/REGRESSION-TESTS.md. Example: StringMapTest.*:DashTest.*"
        required: false
        default: ""
        type: string
      gtest-iterations:
        description: "Optional GoogleTest run count; see .github/REGRESSION-TESTS.md. Default: 1. Example: 12"
        required: false
        default: "1"
        type: string
      continue-on-test-failure:
        description: "Optional failure handling; see .github/REGRESSION-TESTS.md. true continues after failures"
        required: false
        default: false
        type: boolean
      # End manual trigger inputs.

jobs:
  build:
    if: github.repository == 'dragonflydb/dragonfly'
    strategy:
      matrix:
        # Test of these containers
        container: ["ubuntu-dev:24"]
        proactor: [Epoll]
        build-type: [Debug]
        runner: [ubuntu-latest, [self-hosted, linux, ARM64]]

    runs-on: ${{ matrix.runner }}

    permissions:
      id-token: write
      contents: read
      actions: write # To allow deleting cache

    container:
      image: ghcr.io/romange/${{ matrix.container }}
      options: --security-opt seccomp=unconfined --sysctl "net.ipv6.conf.all.disable_ipv6=0"
      volumes:
        - /var/crash:/var/crash
        - /:/hostroot
        - /mnt:/mnt
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Validate manual regression inputs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: .github/scripts/run-regression-tests-helper.sh validate
        env:
          ITERATIONS_INPUT: ${{ inputs.iterations || '1' }}
          TEST_SUITES_INPUT: ${{ inputs.test-suites || '' }}
          TEST_CASES_INPUT: ${{ inputs.test-cases || '' }}
          GTEST_SUITES_INPUT: ${{ inputs.gtest-suites || '' }}
          GTEST_ITERATIONS_INPUT: ${{ inputs.gtest-iterations || '' }}
          MAX_RUN_TIME_INPUT: ${{ inputs.max-run-time || '' }}
          CONTINUE_ON_TEST_FAILURE_INPUT: ${{ inputs.continue-on-test-failure || 'false' }}

      - name: Print environment info
        run: |
          cat /proc/cpuinfo
          ulimit -a
          env

      - name: Build Dragonfly
        uses: ./.github/actions/builder
        with:
          enable-ccache: 'true'
          ccache-save: 'true'
          enable-deps-cache: 'true'
          build-type: ${{matrix.build-type}}
          cache-key-suffix: 'df_common_bin'
          c-compiler: gcc
          cxx-compiler: g++
          targets: 'dragonfly'

      - name: Authenticate to AWS
        if: github.repository_owner == 'dragonflydb' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_CI_S3_ROLE_ARN }}
          aws-region: us-east-1

      - name: Run regression tests action
        uses: ./.github/actions/regression-tests
        with:
          dfly-executable: dragonfly
          gspace-secret: ${{ secrets.GSPACES_BOT_DF_BUILD }}
          build-folder-name: build
          filter: ${{ matrix.build-type == 'Release' && 'not empty' || 'not opt_only' }}
          test-suites: ${{ inputs.test-suites || '' }}
          test-cases: ${{ inputs.test-cases || '' }}
          iterations: ${{ inputs.iterations || '1' }}
          max-run-time: ${{ github.event_name == 'workflow_dispatch' && (inputs.max-run-time || '360') || '80' }}
          gtest-suites: ${{ inputs.gtest-suites || '' }}
          gtest-cases: ${{ inputs.gtest-cases || '' }}
          gtest-iterations: ${{ inputs.gtest-iterations || '' }}
          continue-on-test-failure: ${{ inputs.continue-on-test-failure || 'false' }}
          s3-bucket: ${{ secrets.S3_REGTEST_BUCKET }}
          junit-s3-bucket: ${{ secrets.S3_REGTEST_BUCKET }}
          aws-role-to-assume: ${{ secrets.AWS_CI_S3_ROLE_ARN }}
          # Chain ternary oprator of the form (which can be nested)
          # (expression == condition && <true expression> || <false expression>)
          epoll: ${{ matrix.proactor == 'Epoll' && 'epoll' || 'iouring' }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs
          path: /tmp/failed/*

  lint-test-chart:
    if: github.repository == 'dragonflydb/dragonfly'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/lint-test-chart
