[project]
name = "dragonfly-tests"
version = "0.0.0"
requires-python = ">=3.10"

[dependency-groups]
test = [
  "aiohttp>=3.10.2",
  "async-timeout>=4.0.3",
  "asyncio>=3.4.3",
  "attrs>=22.1.0",
  "azure-storage-blob>=12.19.0",
  "boto3>=1.28.55",
  "celery>=5.3.0",
  "Deprecated>=1.2.13",
  "fakeredis[json]>=2.26.2",
  "hiredis==2.4.0",
  "iniconfig>=1.1.1",
  "meta_memcache>=2.2.0",
  "ml_dtypes>=0.2.0",
  "numpy",
  "packaging>=26.3",
  "pluggy>=1.0.0",
  "prometheus_client>=0.17.0",
  "psutil>=5.9.5",
  "py>=1.11.0",
  "pyparsing>=3.0.9",
  "pytest>=7.1.2",
  "pytest-asyncio==0.20.1",
  "pytest-emoji>=0.2.0",
  "pytest-icdiff>=0.9",
  "pytest-json-report>=1.5.0",
  "pytest-repeat>=0.9.3",
  "pytest-timeout>=2.2.0",
  "PyYAML>=6.0.3",
  "pymemcache>=4.0.0",
  "redis>=5.2.1",
  "redis-om>=0.3.3",
  "requests>=2.28.0",
  "tomli>=2.0.1",
  "urllib3>=1.26.0",
  "valkey>=6.0.2",
  "wrapt>=1.14.1",
]

[tool.uv]
default-groups = ["test"]

[tool.black]
line-length = 100
include = '\.py$'
extend-exclude = '''
/(
    | .git
    | .__pycache__
    | build-dbg
    | build-opt
    | helio
)/
'''
